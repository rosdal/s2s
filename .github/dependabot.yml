version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-toolchain:
        dependency-type: development
        patterns: ["*"]
      production:
        dependency-type: production
        patterns: ["*"]
    ignore:
      # Types track the lowest supported Node (engines: >=22)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
